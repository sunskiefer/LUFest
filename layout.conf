# LUFest (placeholder name) -- layout. EVERY POSITION BELOW IS PARKED: a placeholder grid so the whole plugin can be tried at
# once. Placement is yours: tell me "move <id> to x,y" and only that line changes. ids are in CONTROLMAP.md.
# Text sizes: label_scale=1.7 + scale_names=1 give the Meta4MPCXXL 0.1.2 sizes (names 35.7 px, values 37.4 px, cells 221 wide).
label_scale=1.7
scale_names=1
# Colours are placeholders chosen on purpose (no source panel was given): dark plate, green lit segments.
theme_bg=0d0f10
theme_ink=f2f2f0
theme_ink_dim=9aa0a3
theme_accent=3ddc84
theme_accent_hi=7ff0b0
theme_lcd=15191b
theme_line=2b3234
theme_tile_on=3ddc84
[tab LUFS]
